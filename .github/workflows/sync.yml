name: Sync RoscomVPN routing
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync upstream
        run: python3 scripts/sync.py
      - name: Commit updates
        run: |
          if ! git diff --quiet -- HAPP/DEFAULT.JSON HAPP/DEFAULT.DEEPLINK INCY/DEFAULT.JSON INCY/DEFAULT.DEEPLINK; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add HAPP/DEFAULT.JSON HAPP/DEFAULT.DEEPLINK INCY/DEFAULT.JSON INCY/DEFAULT.DEEPLINK
            git commit -m 'Sync RoscomVPN with GlobalHyperMegaNet DNS settings'
            git push
          else
            echo 'No changes'
          fi
